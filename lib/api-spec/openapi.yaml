  "components": {
    "schemas": {
      "HealthStatus": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string"
          }
        }
      },
      "ServiceData": {
        "type": "object",
        "additionalProperties": true
      },
      "ServiceInput": {
        "type": "object",
        "additionalProperties": true
      },
      "MediaUpload": {
        "type": "object",
        "required": [
          "file"
        ],
        "properties": {
          "file": {
            "type": "string",
            "format": "binary"
          }
        }
      },
      "BookingConfirmation": {
        "type": [
          "object",
          "null"
        ],
        "additionalProperties": false,
        "properties": {
          "ref": {
            "type": "string"
          },
          "ticket_type": {
            "type": "string",
            "enum": [
              "sauna_plunge",
              "plunge_only",
              "weekly_pass",
              "monthly_pass"
            ]
          },
          "session_date": {
            "type": [
              "string",
              "null"
            ]
          },
          "session_time": {
            "type": [
              "string",
              "null"
            ]
          },
          "pass_end": {
            "type": [
              "string",
              "null"
            ]
          },
          "party_size": {
            "type": "integer"
          },
          "unit_price_pence": {
            "type": [
              "integer",
              "null"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "paid",
              "requested",
              "cancelled"
            ]
          }
        },
        "required": [
          "ref",
          "ticket_type",
          "session_date",
          "session_time",
          "pass_end",
          "party_size",
          "unit_price_pence",
          "status"
        ]
      }
    }
  }
}
